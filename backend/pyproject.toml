[project]
name = "agents-dashboard-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Dmitrii Falko",email = "dmitriy.falko@gmail.com"}
]
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.115)",
    "uvicorn[standard] (>=0.34)",
    "pydantic (>=2.0)",
    "pydantic-settings (>=2.0)",
    "sse-starlette (>=2.0)"
]

[project.optional-dependencies]
dev = [
    "pytest (>=8.0)",
    "pytest-asyncio (>=0.24)",
    "httpx (>=0.27)",
    "pytest-cov (>=6.0)",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]
